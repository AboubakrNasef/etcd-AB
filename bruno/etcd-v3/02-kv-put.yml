info:
  name: KV - Put
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v3/kv/put"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "key": "{{key}}",
        "value": "{{value}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
