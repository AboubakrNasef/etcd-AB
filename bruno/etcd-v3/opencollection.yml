docs:
  content: |-
    # etcd v3 HTTP Gateway

    This collection targets a local etcd server on `http://127.0.0.1:2379`.
    The v3 gateway maps protobuf `bytes` fields to base64 strings, so keys and
    values in KV request bodies must be base64 encoded.
