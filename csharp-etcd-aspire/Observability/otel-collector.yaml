receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: etcd
          scrape_interval: 5s
          static_configs:
            - targets:
                - host.docker.internal:23791
                - host.docker.internal:23792
                - host.docker.internal:23793

processors:
  batch:

exporters:
  otlp_grpc:
    endpoint: host.docker.internal:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlp_grpc]
